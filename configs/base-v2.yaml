project:
  name: "VYREX AI"
  version: "0.2.0"
  seed: 42
  language: "en"
  mode: "hybrid"

curriculum:
  stages:
    - "basic_english"
    - "elementary_intermediate_english"
    - "upper_intermediate_english"
    - "advanced_english"
    - "english_aptitude"
  progressive_training: true
  evaluate_before_advancing: true
  retain_previous_stage_knowledge: true

model:
  architecture: "decoder_only_transformer"
  vocab_size: 16000
  hidden_size: 384
  num_layers: 6
  num_heads: 6
  intermediate_size: 1024
  max_seq_len: 1024
  positional_encoding: "rope"
  norm: "rmsnorm"
  mlp: "swiglu"
  dropout: 0.1
  tie_embeddings: true

training:
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  weight_decay: 0.01
  betas: [0.9, 0.95]
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  max_steps: 10000
  warmup_steps: 500
  gradient_clip_norm: 1.0
  precision: "bf16"
  log_every_steps: 10
  eval_every_steps: 500
  checkpoint_every_steps: 500
  num_workers: 2

data:
  tokenizer_name: "vyrex-bpe-en-v1"
  tokenizer_vocab_size: 16000
  train_split: 0.98
  validation_split: 0.01
  test_split: 0.01
  mixture:
    english: 0.90
    aptitude: 0.10
  max_document_chars: 2000000

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  checkpoints_dir: "checkpoints"
  logs_dir: "logs"
  tokenizer_dir: "artifacts/tokenizer"
