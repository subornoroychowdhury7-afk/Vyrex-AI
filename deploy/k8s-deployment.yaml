apiVersion: apps/v1
kind: Deployment
metadata:
  name: vyrex-ai-api
  labels:
    app: vyrex-ai
    tier: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vyrex-ai
  template:
    metadata:
      labels:
        app: vyrex-ai
    spec:
      containers:
        - name: vyrex-api
          image: your-docker-registry/vyrex-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: VYREX_BACKEND
              value: "hf"
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 12Gi
              cpu: "4"
            requests:
              nvidia.com/gpu: 1
              memory: 8Gi
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vyrex-ai-service
spec:
  type: ClusterIP
  selector:
    app: vyrex-ai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vyrex-ai-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vyrex-ai-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
