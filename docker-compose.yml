version: '3.8'

services:
  vyrex-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vyrex-ai:latest
    container_name: vyrex-ai-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - VYREX_BACKEND=hf
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./pretrained:/app/pretrained
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
